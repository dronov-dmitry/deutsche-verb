name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
        working-directory: client

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > client/android/key.jks

      - name: Build APK
        run: flutter build apk --release
        working-directory: client
        env:
          KEYSTORE_PATH: key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build App Bundle
        run: flutter build appbundle --release
        working-directory: client
        env:
          KEYSTORE_PATH: key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            client/build/app/outputs/flutter-apk/app-release.apk
            client/build/app/outputs/bundle/release/app-release.aab

  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: client
      - run: flutter build windows --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: client/build/windows/x64/runner/Release/

  linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev liblzma-dev
      - run: flutter pub get
        working-directory: client
      - run: flutter build linux --release
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: client/build/linux/x64/release/bundle/

  release:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app-release.apk
            android/app-release.aab
          generate_release_notes: true
