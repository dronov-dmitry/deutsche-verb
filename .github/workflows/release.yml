name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
        working-directory: client

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > client/android/key.jks

      - name: Build APK
        run: flutter build apk --release
        working-directory: client
        env:
          KEYSTORE_PATH: key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build App Bundle
        run: flutter build appbundle --release
        working-directory: client
        env:
          KEYSTORE_PATH: key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: client/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: client/build/app/outputs/bundle/release/app-release.aab

  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: client
      - run: flutter build windows --release
        working-directory: client
      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "DeutscheVerb-windows-x64.zip"
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: client/DeutscheVerb-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev liblzma-dev
      - run: flutter pub get
        working-directory: client
      - run: flutter build linux --release
        working-directory: client
      - name: Package Linux build
        run: tar -czf DeutscheVerb-linux-x64.tar.gz -C build/linux/x64/release/bundle .
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: client/DeutscheVerb-linux-x64.tar.gz

  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: client
      - name: Build and archive macOS
        run: |
          flutter build macos --release 2>&1 || {
            echo "❌ macOS build failed (see above)"
            exit 1
          }
          cd build/macos/Build/Products/Release
          app=$(ls -d *.app 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            echo "No .app found in build output" >&2
            ls -la
            exit 1
          fi
          echo "Archiving: $app"
          zip -r DeutscheVerb-macos.zip "$app"
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: client/build/macos/Build/Products/Release/DeutscheVerb-macos.zip

  release:
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: aab

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: windows
        continue-on-error: true

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: linux
        continue-on-error: true

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: macos
        continue-on-error: true

      - name: Create Release
        run: |
          files=()
          files+=("app-release.apk")
          files+=("app-release.aab")
          for f in windows/*.zip; do [ -f "$f" ] && files+=("$f"); done
          for f in linux/*.tar.gz; do [ -f "$f" ] && files+=("$f"); done
          for f in macos/*.zip; do [ -f "$f" ] && files+=("$f"); done
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
